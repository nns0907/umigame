<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>問題一覧 | ウミガメのスープ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="mb-4">🧩 ウミガメのスープ問題一覧</h1>
    <a href="{{ url_for('index') }}" class="btn btn-secondary mb-3">← ゲームに戻る</a>

    {% if riddles %}
    <div class="row g-3">
        {% for id, question, image_filename  in riddles %}
        <div class="col-md-3">
            <div class="card h-100 text-center">
                <!-- 上：画像（loop.index0を利用） -->
                <img src="{{ url_for('static', filename='img/' + image_filename) }}"
                    class="card-img-top" 
                    alt="問題画像" 
                    style="aspect-ratio:1/1; object-fit:cover;">

                <!-- 中央：問題文 -->
                <div class="card-body d-flex flex-column">
                    <p class="card-text flex-grow-1">
                        {{ question[:40] }}{% if question|length > 40 %}…{% endif %}
                    </p>

                    <!-- 下：遊ぶボタン -->
                    <a href="{{ url_for('play_riddle', riddle_id=id) }}" class="btn btn-primary mt-auto">遊ぶ</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
        <div class="alert alert-warning mt-3">まだ問題が登録されていません。</div>
    {% endif %}
</div>
</body>
</html>
